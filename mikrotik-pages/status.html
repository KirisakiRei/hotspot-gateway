<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Connected - WiFi Hotspot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .success-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            color: #1f2937;
            font-size: 24px;
            margin-bottom: 12px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 24px;
        }
        
        .info-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #6b7280;
            font-size: 14px;
        }
        
        .info-value {
            color: #1f2937;
            font-weight: 600;
            font-size: 14px;
        }
        
        .redirect-text {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(102, 126, 234, 0.5);
        }
        
        .btn-secondary {
            display: inline-block;
            padding: 10px 24px;
            background: #f3f4f6;
            color: #374151;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            margin-top: 12px;
            font-size: 14px;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h1>Terhubung ke Internet!</h1>
        <p class="subtitle">Anda berhasil login ke WiFi Hotspot</p>
        
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-value" id="username">$(username)</span>
            </div>
            <div class="info-row">
                <span class="info-label">IP Address</span>
                <span class="info-value" id="ip">$(ip)</span>
            </div>
            <div class="info-row">
                <span class="info-label">MAC Address</span>
                <span class="info-value" id="mac">$(mac)</span>
            </div>
            <div class="info-row">
                <span class="info-label">Session Time</span>
                <span class="info-value" id="uptime">$(uptime)</span>
            </div>
        </div>
        
        <div class="spinner"></div>
        <p class="redirect-text">Mengalihkan ke halaman utama...</p>
        
        <a href="$(link-orig)" class="btn" id="continueBtn">Lanjutkan Browsing</a>
        
        <br>
        <a href="$(link-logout)" class="btn-secondary">Logout</a>
    </div>
    
    <script>
        // Portal success URL - akan redirect ke sini
        // Ganti dengan URL portal Anda
        var PORTAL_SUCCESS_URL = 'http://10.10.10.2:5173/portal?status=connected';
        
        // Ambil parameter dari Mikrotik
        var username = '$(username)';
        var mac = '$(mac)';
        var ip = '$(ip)';
        var linkOrig = '$(link-orig)';
        
        // Build redirect URL dengan parameter
        var redirectUrl = PORTAL_SUCCESS_URL + 
            '&mac=' + encodeURIComponent(mac) + 
            '&ip=' + encodeURIComponent(ip) +
            '&username=' + encodeURIComponent(username);
        
        // Jika ada link-orig, tambahkan
        if (linkOrig && linkOrig !== '' && !linkOrig.includes('$(')) {
            redirectUrl += '&link-orig=' + encodeURIComponent(linkOrig);
        }
        
        // Auto redirect setelah 2 detik
        setTimeout(function() {
            window.location.href = redirectUrl;
        }, 2000);
        
        // Update continue button
        document.getElementById('continueBtn').href = redirectUrl;
    </script>
</body>
</html>
