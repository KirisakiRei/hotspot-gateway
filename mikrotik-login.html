<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      ============================================================
      HALAMAN LOGIN MIKROTIK (custom) - redirect ke Portal Hotspot
      ============================================================
      1. Upload file ini sebagai login page hotspot:
         /ip hotspot profile set public-wifi html-directory=...
         (lihat MIKROTIK_LOGIN_SETUP.md)
      2. http://192.168.88.100:5173/portal wajib disesuaikan dengan IP server aplikasi Anda
         (contoh: http://192.168.88.100:5173/portal)
      3. Server IP/port tersebut WAJIB masuk walled-garden
         (lihat hotspot-setup.rsc section 6b) agar bisa diakses
         sebelum login - jika tidak, redirect ini akan diblokir.
      4. Variabel $(mac) $(ip) $(link-orig) $(link-login) diisi
         otomatis oleh MikroTik saat halaman di-serve.
      ============================================================
    -->
    <meta http-equiv="refresh" content="0;url=http://192.168.88.100:5173/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)">
    <title>Redirecting to Portal...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 20px auto;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            color: #1a202c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            font-size: 14px;
        }

        .manual-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .manual-link:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Menghubungkan...</h1>
        <p>Mohon tunggu, sedang mengarahkan Anda ke portal...</p>
        
        <!-- Fallback jika meta refresh tidak work -->
        <a href="http://192.168.88.100:5173/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)" class="manual-link">
            Klik di sini jika tidak otomatis redirect
        </a>
    </div>

    <script>
        // Triple redundancy untuk memastikan redirect work

        // Method 1: Immediate redirect
        window.location.href = 'http://192.168.88.100:5173/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)';

        // Method 2: Fallback after 100ms
        setTimeout(function() {
            window.location.replace('http://192.168.88.100:5173/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)');
        }, 100);
    </script>
</body>
</html>
