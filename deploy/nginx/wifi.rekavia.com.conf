# /etc/nginx/sites-available/wifi.rekavia.com
# Setelah certbot: file ini tetap jadi template; certbot menambah blok SSL.

upstream hotspot_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wifi.rekavia.com;

    client_max_body_size 110m;

    root /var/www/wifi.rekavia.com/dist;
    index index.html;

    location /api/ {
        proxy_pass http://hotspot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /videos/ {
        proxy_pass http://hotspot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /socket.io/ {
        proxy_pass http://hotspot_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
