# FreeRADIUS clients.conf — untuk arsitektur Direct RADIUS (tanpa VPN/API)
# Lokasi di VPS: /etc/freeradius/3.0/clients.conf
#
# MikroTik mengirim paket RADIUS langsung ke IP publik VPS.
# Karena IP WAN tiap router bersifat dinamis (dari ISP), kita terima dari
# alamat IP mana pun (0.0.0.0/0), lalu identifikasi router via NAS-Identifier
# (system identity MikroTik) yang dikirim di tiap paket.
#
# Keamanan dijaga oleh shared secret + Message-Authenticator (integritas paket).

client all-routers {
    # Terima dari semua IP (router IP dinamis)
    ipaddr                          = 0.0.0.0/0

    # GANTI dengan secret panjang minimal 32 karakter.
    # Secret ini SAMA untuk semua router (identitas per-router via NAS-Identifier).
    secret                          = GANTI_DENGAN_SECRET_PANJANG_MINIMAL_32_KARAKTER

    # Wajib: verifikasi integritas paket (RFC 2869 Message-Authenticator)
    require_message_authenticator   = yes

    # Tipe NAS
    nas_type                        = other

    # Batasi koneksi per sumber untuk menahan flood
    limit {
        max_connections = 16
        lifetime        = 0
        idle_timeout    = 30
    }
}