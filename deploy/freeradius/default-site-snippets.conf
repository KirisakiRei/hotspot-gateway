# Panduan edit untuk /etc/freeradius/3.0/sites-enabled/default
#
# Buka file dengan:  nano /etc/freeradius/3.0/sites-enabled/default
# Lalu sesuaikan 3 bagian berikut (authorize, authenticate, accounting).
# Nilai di bawah adalah TARGET yang diinginkan — cukup pastikan "rest"
# ada di dalam blok yang benar.

# ============================================================
# 1) Bagian "authorize { ... }"
#    (sekitar baris 182)
#    Tambahkan kata "rest" — letakkan setelah "preprocess".
# ============================================================
authorize {
    preprocess

    # Masking / normalisasi bisa dikosongkan (hapus baris following
    # yang tidak relevan). Yang PENTING: ada "rest" di sini.
    rest

    expiration
    logintime

    pap
    chap
    mschap
    digest

    suffix
    ntdomain
    eap {
        ok = return
    }

    files
}

# ============================================================
# 2) Bagian "authenticate { ... }"
#    (sekitar baris 240)
#    Biarkan default. Karena backend mengembalikan Auth-Type = Accept,
#    bagian ini TIDAK akan dieksekusi untuk login yang sukses.
#    Cukup pastikan Auth-Type PAP tersedia sebagai fallback.
# ============================================================
authenticate {
    Auth-Type PAP {
        pap
    }

    Auth-Type CHAP {
        chap
    }

    Auth-Type MS-CHAP {
        mschap
    }

    digest
    eap
}

# ============================================================
# 3) Bagian "accounting { ... }"
#    (sekitar baris 330)
#    Pastikan "rest" ada di dalamnya.
# ============================================================
accounting {
    detail
    unix
    radutmp
    rest
    exec
    attr_filter.accounting_response
}