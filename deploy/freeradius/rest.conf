# FreeRADIUS rest module config
# Lokasi di VPS: /etc/freeradius/3.0/mods-enabled/rest
#
# Module ini menghubungkan FreeRADIUS ke backend NestJS (localhost:1708)
# untuk authorize dan accounting melalui REST API.

rest {
    # Base URL backend NestJS
    connect_uri = "http://127.0.0.1:1708/api/radius"

    # Custom HTTP headers
    headers {
        Content-Type = "application/json"
        X-Radius-Secret = "GANTI_DENGAN_RADIUS_INTERNAL_SECRET_YANG_SAMA_DI_ENV_BACKEND"
    }

    connect_timeout = 2

    # Authorize: dipanggil saat Access-Request
    # Backend memvalidasi kode voucher & mengembalikan Access-Accept/Reject
    authorize {
        uri = "${..connect_uri}/authorize"
        method = "post"
        body = "json"
        data = '{"username":"%{User-Name}","password":"%{User-Password}","nasIdentifier":"%{NAS-Identifier}","nasIpAddress":"%{NAS-IP-Address}","callingStationId":"%{Calling-Station-Id}","calledStationId":"%{Called-Station-Id}"}'
    }

    # Accounting: dipanggil saat Accounting-Start / Interim-Update / Stop
    accounting {
        uri = "${..connect_uri}/accounting"
        method = "post"
        body = "json"
        data = '{"acctStatusType":"%{Acct-Status-Type}","username":"%{User-Name}","nasIdentifier":"%{NAS-Identifier}","nasIpAddress":"%{NAS-IP-Address}","callingStationId":"%{Calling-Station-Id}","framedIpAddress":"%{Framed-IP-Address}","acctSessionId":"%{Acct-Session-Id}","acctSessionTime":"%{Acct-Session-Time}","acctInputOctets":"%{Acct-Input-Octets}","acctOutputOctets":"%{Acct-Output-Octets}","acctTerminateCause":"%{Acct-Terminate-Cause}"}'
    }
}