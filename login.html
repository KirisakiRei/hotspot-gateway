<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://wifi.rekavia.com/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)">
    <title>Menghubungkan...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e5e7eb;
        }
        .container { text-align: center; max-width: 360px; }
        .spinner {
            width: 48px; height: 48px; margin: 0 auto 20px;
            border: 4px solid #374151; border-top-color: #6366f1;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #818cf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Mengalihkan ke portal WiFi...</p>
        <p style="margin-top:16px;font-size:13px;">
            <a href="https://wifi.rekavia.com/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)">
                Ketuk di sini jika tidak berpindah otomatis
            </a>
        </p>
    </div>
    <script>
        var url = 'https://wifi.rekavia.com/portal?mac=$(mac)&ip=$(ip)&link-orig=$(link-orig)&link-login=$(link-login)&link-login-only=$(link-login-only)';
        window.location.replace(url);
    </script>
</body>
</html>
